# Render Blueprint — https://render.com/docs/blueprint-spec
# Free plans to start. Note: free web services sleep when idle (first WhatsApp reply can take ~1 min)
# and free Postgres expires after 30 days. Before judging (Nov 13–Dec 15), apply the $50 hackathon credit
# and upgrade both plans so the demo stays fast and the database does not expire.
services:
  - type: web
    name: sarafupay-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: sarafupay-db
          property: connectionString
      - key: ENABLE_SIMULATOR
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_DISPLAY_NUMBER
        sync: false
      - key: SANDBOX_BUYER_EMAIL
        sync: false
      - key: SANDBOX_BUYER_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false

databases:
  - name: sarafupay-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
