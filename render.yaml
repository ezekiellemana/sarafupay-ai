# Render Blueprint — https://render.com/docs/blueprint-spec
#
# SarafuPay runs entirely on Render, as four services in one region (Frankfurt):
#
#   WhatsApp / PayPal webhooks ──► sarafupay-ai (web, Next.js) ──► sarafupay-db (Postgres)
#                                        │    ▲                 └─► sarafupay-kv (Key Value)
#                                        │    │ every 15 min
#                                        │    └── sarafupay-reconcile (cron)
#
# - sarafupay-ai: always-on web service (paid instance, no cold starts) serving the
#   WhatsApp + PayPal webhooks, the public collection/checkout pages, the AG Studio
#   treasurer dashboard and the judges' web simulator.
# - sarafupay-db: Postgres, the source of truth for collections, contributions,
#   pledges, payouts and webhook de-duplication.
# - sarafupay-kv: Key Value (Redis-compatible), private network only. Holds the AI
#   cost-guard counters so limits survive deploys and work across instances.
# - sarafupay-reconcile: cron job that recovers payments whose webhook was missed,
#   finalises stuck payouts and prunes old de-duplication rows.
#
# Secrets (PayPal, Gemini, WhatsApp) are `sync: false`: entered once in the dashboard,
# never committed. CRON_SECRET is generated by Render and shared via `fromService`.

services:
  - type: web
    name: sarafupay-ai
    runtime: node
    plan: 0.5c-512mb # Starter: always on, no cold starts during judging
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: sarafupay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sarafupay-kv
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      # Signs evidence cards (Render generates a base64 256-bit value: exactly an Ed25519 seed).
      - key: EVIDENCE_SIGNING_KEY
        generateValue: true
      - key: ENABLE_SIMULATOR
        value: "true"
      - key: DAILY_AI_LIMIT
        value: "150"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_DISPLAY_NUMBER
        sync: false
      - key: SANDBOX_BUYER_EMAIL
        sync: false
      - key: SANDBOX_BUYER_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false

  - type: keyvalue
    name: sarafupay-kv
    plan: free
    region: frankfurt
    maxmemoryPolicy: volatile-lru # every key we write has a TTL
    ipAllowList: [] # private network only: reachable from sarafupay-ai, not the internet

  - type: cron
    name: sarafupay-reconcile
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    schedule: "*/15 * * * *"
    buildCommand: "true" # dependency-free script, nothing to build
    startCommand: node scripts/cron-reconcile.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        fromService:
          type: web
          name: sarafupay-ai
          envVarKey: APP_URL
      - key: CRON_SECRET
        fromService:
          type: web
          name: sarafupay-ai
          envVarKey: CRON_SECRET

databases:
  - name: sarafupay-db
    plan: 0.1c-256mb # paid Postgres: no 30-day expiry
    region: frankfurt
    postgresMajorVersion: "16"
